<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Khung chứa danh sách ảnh */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 1. Mặc định (Màn hình > 700px): Hiển thị 4 ảnh trên 1 dòng */
        .gallery-item {
            flex: 0 0 calc(25% - 11.25px); /* 4 cột (100% / 4 = 25%), trừ bớt khoảng cách gap */
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .desc {
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        /* 2. Media Query: Màn hình <= 700px (Hiển thị 2 ảnh trên 1 dòng) */
        @media (max-width: 700px) {
            .gallery-item {
                flex: 0 0 calc(50% - 7.5px); /* 2 cột (100% / 2 = 50%) */
            }
        }

        /* 3. Media Query: Màn hình <= 500px (Hiển thị 1 ảnh trên 1 dòng) */
        @media (max-width: 500px) {
            .gallery-item {
                flex: 0 0 100%; /* 1 cột chiếm trọn 100% chiều rộng */
            }
        }
    </style>
</head>
<body>

    <h1>Bộ Sưu Tập Ảnh Responsive</h1>

    <div class="gallery-container">
        <!-- Ảnh 1 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Hình ảnh 1">
            <div class="desc">Thiên nhiên hùng vĩ</div>
        </div>

        <!-- Ảnh 2 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Hình ảnh 2">
            <div class="desc">Thành phố về đêm</div>
        </div>

        <!-- Ảnh 3 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=3" alt="Hình ảnh 3">
            <div class="desc">Biển xanh cát trắng</div>
        </div>

        <!-- Ảnh 4 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Hình ảnh 4">
            <div class="desc">Mùa thu lá vàng</div>
        </div>

        <!-- Ảnh 5 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=5" alt="Hình ảnh 5">
            <div class="desc">Núi tuyết phủ dày</div>
        </div>

        <!-- Ảnh 6 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=6" alt="Hình ảnh 6">
            <div class="desc">Rừng nguyên sinh</div>
        </div>

        <!-- Ảnh 7 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=7" alt="Hình ảnh 7">
            <div class="desc">Hoàng hôn trên biển</div>
        </div>

        <!-- Ảnh 8 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=8" alt="Hình ảnh 8">
            <div class="desc">Kiến trúc hiện đại</div>
        </div>
    </div>

</body>
</html>
