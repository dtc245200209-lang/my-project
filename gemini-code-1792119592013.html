<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màu nền và Ảnh nền CSS</title>
    <!-- Liên kết đến tệp CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Chào mừng đến với trang web của tôi</h1>
    <p>Đây là trang web thực hành cách thiết lập màu nền cho toàn bộ trang và sử dụng ảnh nền để làm nổi bật một khu vực cụ thể.</p>

    <!-- Khối div chứa nội dung quan trọng -->
    <div class="important-content">
        <h2>Thông Báo Quan Trọng</h2>
        <p>Khối nội dung này được sử dụng ảnh nền (background-image) và nội dung bên trong đã được căn giữa.</p>
    </div>

</body>
</html>
