<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .center {
            text-align: center;
            font-weight: bold;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <!-- Sử dụng rowspan="2" để gộp 2 hàng cho cột Ngày -->
        <tr>
            <td rowspan="2">Thứ Hai (19/10)</td>
            <td>08:00 - 10:00</td>
            <td>Họp giao ban Ban Giám đốc</td>
        </tr>
        <tr>
            <td>14:00 - 15:30</td>
            <td>Review tiến độ dự án quý IV</td>
        </tr>
        <!-- Sử dụng colspan="2" để gộp 2 cột (Giờ và Nội dung) -->
        <tr>
            <td>Thứ Ba (20/10)</td>
            <td colspan="2" class="center">Hoạt động Teambuilding toàn công ty (Nghỉ họp)</td>
        </tr>
        <!-- Hàng bình thường -->
        <tr>
            <td>Thứ Tư (21/10)</td>
            <td>09:00 - 11:00</td>
            <td>Gặp gỡ và đàm phán với đối tác</td>
        </tr>
    </table>

</body>
</html>
