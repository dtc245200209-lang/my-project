<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <style>
        /* Sửa lỗi cú pháp Reset CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 20px;
            color: white;
            position: relative; /* Giúp menu con hiển thị đúng vị trí bên dưới navbar trên mobile */
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin: 0 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff9800; /* Thêm hiệu ứng đổi màu khi di chuột */
        }

        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Mặc định ẩn trên mobile */
                flex-direction: column;
                position: absolute;
                top: 100%; /* Đặt ngay dưới thanh navbar */
                left: 0;
                background-color: #333;
                width: 100%;
                text-align: center;
                box-shadow: 0 4px 6px rgba(0,0,0,0.2);
                z-index: 1000;
            }

            /* Đổi trạng thái hiển thị khi nhấn biểu tượng ☰ */
            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                padding: 15px 0;
                border-top: 1px solid #444;
                margin: 0;
            }

            .menu-icon {
                display: block; /* Hiển thị icon hamburger trên mobile */
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
        <div class="menu-icon">☰</div>
    </nav>

    <!-- Xử lý JavaScript đóng/mở menu -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuIcon = document.querySelector(".menu-icon");
            const navLinks = document.querySelector(".nav-links");

            menuIcon.addEventListener("click", function () {
                navLinks.classList.toggle("active");
            });
        });
    </script>

</body>
</html>
